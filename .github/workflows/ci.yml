name: ci

on:
  push:
    branches: [main]
  pull_request:

# private リポジトリの Actions 無料枠（2,000分/月）を守るため、同じブランチの古い実行は取り消す。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # gitleaks-action が PR のコミット一覧を API で取るのに要る
  pull-requests: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks が push/PR の差分を正しく評価できるよう全履歴を取得する。
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bunx prisma generate

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 個人アカウントの private リポジトリでは GITLEAKS_LICENSE は不要
